# /etc/nginx/career.conf
# Подключается ОДНОЙ строкой внутри server{} для 443 в
# /etc/nginx/sites-available/meet.rbmclub.com.conf:
#     include /etc/nginx/career.conf;
#
# Почему = и ^~, а не обычный location /career:
# у Jitsi есть regex-локация ^/([^/?&:'"]+)$ для имён комнат, а regex в nginx
# приоритетнее prefix-match. `=` (точное совпадение) и `^~` — единственные,
# которые её обходят.

location = /career { return 301 /career/; }

location ^~ /career/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 300s;      # LLM отвечает долго
    proxy_buffering off;          # стриминг ответов советника
    client_max_body_size 15m;     # загрузка резюме
}
