name: career
services:
  app:
    image: career:latest
    build: .
    ports: ["127.0.0.1:3010:3000"]
    env_file: .env
    depends_on: [db, redis]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 700m }

  worker:
    image: career:latest
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env
    depends_on: [db, redis]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 700m }

  db:
    image: pgvector/pgvector:pg16
    ports: ["127.0.0.1:5433:5432"]      # 5432 может быть занят
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: career
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=256MB -c work_mem=8MB
               -c max_connections=30 -c effective_cache_size=768MB
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 900m }

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    ports: ["127.0.0.1:6380:6379"]
    restart: unless-stopped
